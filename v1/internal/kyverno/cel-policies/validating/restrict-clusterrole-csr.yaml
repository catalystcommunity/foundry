apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: restrict-clusterrole-csr
  annotations:
    policies.kyverno.io/title: Restrict ClusterRole CSR Approval
    policies.kyverno.io/category: RBAC Best Practices
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: ClusterRole
    policies.kyverno.io/description: >-
      Prevent ClusterRoles from granting certificate request approval or signer
      approval permissions.
spec:
  validationActions: [Audit]
  evaluation:
    background:
      enabled: false
  matchConstraints:
    resourceRules:
      - apiGroups: ["rbac.authorization.k8s.io"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["clusterroles"]
  validations:
    - expression: >-
        !has(object.rules) || object.rules.all(rule,
          !has(rule.resources) ||
          !rule.resources.exists(resource, resource == 'certificatesigningrequests/approval') ||
          !has(rule.verbs) ||
          rule.verbs.all(verb, verb != 'update' && verb != 'patch' && verb != '*'))
      message: >-
        ClusterRoles must not update or patch certificatesigningrequests/approval.
    - expression: >-
        !has(object.rules) || object.rules.all(rule,
          !has(rule.resources) ||
          !rule.resources.exists(resource, resource == 'signers') ||
          !has(rule.verbs) ||
          rule.verbs.all(verb, verb != 'approve' && verb != '*'))
      message: ClusterRoles must not approve signers.
