apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: restrict-apparmor-profiles
  annotations:
    policies.kyverno.io/title: Restrict AppArmor Profiles
    policies.kyverno.io/category: Pod Security Standards (Baseline)
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Allow only RuntimeDefault and Localhost AppArmor profiles at the Pod and
      container levels.
spec:
  validationActions: [Deny]
  evaluation:
    background:
      enabled: true
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
  variables:
    - name: allContainers
      expression: >-
        object.spec.containers +
        object.spec.?initContainers.orValue([]) +
        object.spec.?ephemeralContainers.orValue([])
  validations:
    - expression: >-
        !has(object.spec.securityContext) ||
        !has(object.spec.securityContext.appArmorProfile) ||
        object.spec.securityContext.appArmorProfile.type in ['RuntimeDefault', 'Localhost']
      message: Pod AppArmor profiles must use RuntimeDefault or Localhost.
    - expression: >-
        variables.allContainers.all(container,
          !has(container.securityContext) ||
          !has(container.securityContext.appArmorProfile) ||
          container.securityContext.appArmorProfile.type in ['RuntimeDefault', 'Localhost'])
      message: Container AppArmor profiles must use RuntimeDefault or Localhost.
