apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: disallow-latest-tag
  annotations:
    policies.kyverno.io/title: Disallow Latest Tag in VPOL
    policies.kyverno.io/category: Best Practices in VPOL
    policies.kyverno.io/minversion: 1.14.0
    kyverno.io/kubernetes-version: "1.30"
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      The ':latest' tag is mutable and can lead to unexpected errors if the
      image changes. A best practice is to use an immutable tag that maps to
      a specific version of an application Pod. This policy validates that the image
      uses a non-latest tag or a digest. It checks application containers,
      init containers, and ephemeral containers.
spec:
  validationActions: [Audit]
  evaluation:
    background:
      # The reports controller cannot list the ephemeralcontainers subresource.
      enabled: false
  matchConstraints:
        resourceRules:
          - apiGroups: ['']
            apiVersions: [v1]
            operations: [CREATE, UPDATE]
            resources: [pods, pods/ephemeralcontainers]
  variables:
    - name: allContainers
      expression: >-
        object.spec.containers + object.spec.?initContainers.orValue([]) +
        object.spec.?ephemeralContainers.orValue([])
  validations:
    - expression: >-
        variables.allContainers.all(container, container.image.contains('@') ||
          (container.image.matches('(^|/)[^/:]+:[^/:]+$') && !container.image.endsWith(':latest')))
      message: "Images must use a non-latest tag or a digest."

