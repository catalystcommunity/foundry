apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: restrict-automount-sa-token
  annotations:
    policies.kyverno.io/title: Restrict Pod Service Account Token Automount
    policies.kyverno.io/category: Best Practices
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Require Pods to disable automatic mounting of ServiceAccount credentials.
spec:
  validationActions: [Audit]
  evaluation:
    background:
      enabled: true
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
  matchConditions:
    - name: exclude-policy-reporter
      expression: >-
        !has(object.metadata.labels) ||
        !('app.kubernetes.io/part-of' in object.metadata.labels) ||
        object.metadata.labels['app.kubernetes.io/part-of'] != 'policy-reporter'
  validations:
    - expression: object.spec.?automountServiceAccountToken.orValue(true) == false
      message: Pods must set spec.automountServiceAccountToken to false.
