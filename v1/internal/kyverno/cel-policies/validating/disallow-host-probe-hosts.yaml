apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: disallow-host-probe-hosts
  annotations:
    policies.kyverno.io/title: Disallow Probe Hosts
    policies.kyverno.io/category: Best Practices
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Prevent HTTP probes from overriding the destination host because a
      container can use that field to probe services outside the Pod.
spec:
  validationActions: [Deny]
  evaluation:
    background:
      enabled: true
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
  variables:
    - name: allContainers
      expression: >-
        object.spec.containers +
        object.spec.?initContainers.orValue([]) +
        object.spec.?ephemeralContainers.orValue([])
  validations:
    - expression: >-
        variables.allContainers.all(container,
          !has(container.livenessProbe) ||
          !has(container.livenessProbe.httpGet) ||
          !has(container.livenessProbe.httpGet.host) ||
          container.livenessProbe.httpGet.host == '')
      message: Liveness probes must not set httpGet.host.
    - expression: >-
        variables.allContainers.all(container,
          !has(container.readinessProbe) ||
          !has(container.readinessProbe.httpGet) ||
          !has(container.readinessProbe.httpGet.host) ||
          container.readinessProbe.httpGet.host == '')
      message: Readiness probes must not set httpGet.host.
    - expression: >-
        variables.allContainers.all(container,
          !has(container.startupProbe) ||
          !has(container.startupProbe.httpGet) ||
          !has(container.startupProbe.httpGet.host) ||
          container.startupProbe.httpGet.host == '')
      message: Startup probes must not set httpGet.host.
