apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: drop-cap-net-raw
  annotations:
    policies.kyverno.io/title: Drop CAP_NET_RAW in VPOL
    policies.kyverno.io/category: Best Practices in VPOL
    policies.kyverno.io/minversion: 1.14.0
    kyverno.io/kubernetes-version: "1.30"
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Capabilities permit privileged actions without giving full root access. The
      CAP_NET_RAW capability, enabled by default, allows processes in a container to
      forge packets and bind to any interface potentially leading to MitM attacks.
      Containers must drop ALL, NET_RAW, or CAP_NET_RAW. They must not add
      ALL, NET_RAW, or CAP_NET_RAW. Capability names are case-insensitive.
spec:
  validationActions: [Audit]
  evaluation: 
     background: 
           enabled: true
  matchConstraints:
        resourceRules:
          - apiGroups: ['']
            apiVersions: [v1]
            operations: [CREATE, UPDATE]
            resources: [pods]
  variables:
            - name: mustDropCapabilities
              expression: "['ALL','CAP_NET_RAW','NET_RAW']"
            - name: allContainers
              expression: "object.spec.containers + object.spec.?initContainers.orValue([]) + object.spec.?ephemeralContainers.orValue([])"
  validations:
            - expression: >-
                variables.allContainers.all(container,
                  container.?securityContext.?capabilities.?drop.orValue([]).exists(capability,
                    capability.upperAscii() in variables.mustDropCapabilities) &&
                  !container.?securityContext.?capabilities.?add.orValue([]).exists(capability,
                    capability.upperAscii() in variables.mustDropCapabilities))
              message: >-
                Containers must drop ALL or NET_RAW and must not add NET_RAW back.
