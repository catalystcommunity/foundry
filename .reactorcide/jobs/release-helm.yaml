name: foundry-release-helm
description: "On merge to main touching the chart: package it and publish a GitHub release"
job:
  image: containers.catalystsquad.com/public/reactorcide/runnerbase:latest
  command: "runnerlib run --job-command true"
  timeout: 1200
  priority: 15
  working_dir: /job
  disable_run_local: true
environment:
  FOUNDRY_RELEASE_JOB: helm
  GITHUB_PAT: "${secret:catalystcommunity/ci:githubpat}"
