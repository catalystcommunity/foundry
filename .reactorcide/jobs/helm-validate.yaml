name: foundry-helm-validate
description: "Lint and template the gateway-controller Helm chart on PRs that touch it"
job:
  image: containers.catalystsquad.com/public/reactorcide/runnerbase:latest
  command: "runnerlib run --job-command true"
  timeout: 600
  priority: 10
  working_dir: /job
environment:
  FOUNDRY_CI_JOB: helm-validate
run_local:
  user: host
