name: foundry-image-build-test
description: "Verify the Foundry container image builds on PRs that touch the build (no push)"
job:
  image: containers.catalystsquad.com/public/reactorcide/runnerbase:latest
  command: "runnerlib run --job-command true"
  timeout: 1800
  priority: 10
  working_dir: /job
  capabilities:
    - builder
environment:
  FOUNDRY_CI_JOB: image-build-test
