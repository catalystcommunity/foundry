name: foundry-conventional-commits
description: "Validate PR commits follow conventional commits (semver-tags drives releases from these)"
job:
  image: containers.catalystsquad.com/public/reactorcide/runnerbase:latest
  command: "runnerlib run --job-command true"
  timeout: 300
  priority: 10
  working_dir: /job
  disable_run_local: true
environment:
  FOUNDRY_CI_JOB: conventional-commits
