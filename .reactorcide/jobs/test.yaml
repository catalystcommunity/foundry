name: foundry-test
description: "Build and run the Go unit tests (short mode; integration tests run elsewhere)"
job:
  image: containers.catalystsquad.com/public/reactorcide/runnerbase:latest
  command: "runnerlib run --job-command true"
  timeout: 1800
  priority: 10
  working_dir: /job
environment:
  FOUNDRY_CI_JOB: test-go
run_local:
  user: host
