name: foundry-release-server
description: "Build and publish the Foundry multi-architecture image"
job:
  image: containers.catalystsquad.com/public/reactorcide/runnerbase:latest
  command: "runnerlib run --job-command true"
  timeout: 1800
  priority: 15
  working_dir: /job
  capabilities:
    - builder
  resources:
    cpu:
      request: "6"
      limit: "6"
    memory:
      limit: "8GB"
  disable_run_local: true
environment:
  FOUNDRY_RELEASE_JOB: image
  PYTHONUNBUFFERED: "1"
  REGISTRY: "containers.catalystsquad.com"
  IMAGE_PATH: "public/catalystcommunity/foundry"
  REGISTRY_USER: "${secret:catalystcommunity/registry:user}"
  REGISTRY_PASSWORD: "${secret:catalystcommunity/registry:password}"
