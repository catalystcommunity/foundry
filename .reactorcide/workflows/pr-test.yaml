id: foundry-pr-test
name: Foundry PR Tests
description: "Build and run the Go unit tests on PRs that touch the server or CSIL contracts."

# Reactorcide path filters apply to a whole workflow, not to one job node, so
# each path-scoped job lives in its own workflow file.
on:
  events:
    - pull_request_opened
    - pull_request_updated
  branches:
    - main

paths:
  include:
    - "v1/**"
    - "csil/**"

jobs:
  foundry-test:
    job_file: test.yaml
